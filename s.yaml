edition: 3.0.0
name: crane-copy
access: "dev1"

vars:
  region: "cn-hongkong"

resources:
  crane-copy-fc:
    component: fc3
    props:
      region: ${vars.region}
      functionName: "crane-copy"
      runtime: "custom-container"
      description: 'crane copy'
      timeout: 300
      memorySize: 1024
      cpu: 1
      diskSize: 512
      customContainerConfig:
        image: "ccr.ccs.tencentyun.com/service12/crane-copy:1.2"
        port: 8080
        registryConfig:
          authConfig:
            userName: "${env('REG_USER')}"
            password: "${env('REG_PWD')}"
      internetAccess: true
      logConfig:
        enableInstanceMetrics: false
        enableRequestMetrics: false
        logBeginRule: DefaultRegex
        logstore: default-logs
        project: serverless-cn-hongkong-82dcb112-fd86-5f04-b26c-a921f9a1cb72
      triggers:
        - triggerName: copy-http
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
