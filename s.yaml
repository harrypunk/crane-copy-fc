edition: 3.0.0
name: crane-copy
access: "dev1"

vars:
  region: "cn-hongkong"

resources:
  crane-copy-fc:
    component: fc3
    props:
      region: ${vars.region}
      functionName: "crane-copy"
      runtime: "custom-container"
      description: 'crane copy'
      timeout: 300
      memorySize: 1024
      cpu: 1
      diskSize: 512
      customContainerConfig:
        image: ""
        port: 8080
      internetAccess: true
      triggers:
        - triggerName: copy-http
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
